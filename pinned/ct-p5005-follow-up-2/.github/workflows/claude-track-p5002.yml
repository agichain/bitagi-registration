  report:
    name: P5-002 report (hosted)
    needs: [plan, observe]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the exact dispatched head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'

      # GET requests only, both modes: every page of this workflow's dispatch listing, then per run read its
      # artifact listing, its attempt-1 jobs listing and the zips the tool names (an EXPLORATORY dispatch reads its
      # own run only; of a run that never started only its records, for a critical read made before the marker).
      - name: Read the dispatch listing and every attempt's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          P5002_MODE: ${{ inputs.mode }}
          P5002_REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
        run: |
          set -euo pipefail
          case "$P5002_MODE" in CONFIRMATORY|EXPLORATORY) ;; *) echo "p5002: INPUT mode" >&2; exit 2 ;; esac
          [[ "$P5002_REGISTRATION_SHA256" =~ ^([0-9a-f]{64})?$ ]] || { echo "p5002: INPUT registration_sha256" >&2; exit 2; }
          registration=""
          if [ "$P5002_MODE" = CONFIRMATORY ]; then registration="$P5002_REGISTRATION_SHA256"; fi
          tool=tools/claude_track_p5002_confirm.py
          listing=target/p5002/listing
          attempts=target/p5002/attempts
          line=target/p5002/line.json
          mkdir -p "$listing" "$attempts"
          ask() {   # one command of the tool: its line is printed and kept, and its exit code is the step's
            status=0
            python3 "$tool" "$@" > "$line" || status=$?
            cat "$line"
            [ "$status" = 0 ] || exit "$status"
          }
          value() {   # one key of the kept line; a list as words
            python3 -c 'import json, sys
          v = json.load(open(sys.argv[1]))[sys.argv[2]]
          print(" ".join(map(str, v)) if isinstance(v, list) else v)' "$line" "$1"
          }
          query="event=workflow_dispatch&per_page=100"
          base="repos/$GITHUB_REPOSITORY/actions/workflows/claude-track-p5002.yml/runs?$query"
          gh api "$base&page=1" > "$listing/runs-1.json"
          ask pages --dir "$listing"
          pages=$(value pages)
          for page in $(seq 2 "$pages"); do
            gh api "$base&page=$page" > "$listing/runs-$page.json"
          done
          ask runs --mode "$P5002_MODE" --registration-sha256 "$registration" --listing "$listing" \
            --run-id "$GITHUB_RUN_ID"
          runs=$(value runs)
          for id in $runs; do
            dir="$attempts/$id"
            mkdir "$dir"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" > "$dir/artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/1/jobs?per_page=100" > "$dir/jobs.json"
            ask downloads --dir "$dir" --run-id "$id"
            pairs=$(value downloads)
            for pair in $pairs; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${pair#*:}/zip" > "$dir/${pair%%:*}.zip"
            done
          done

      # The SHA-256 lines printed here are the report's and the observation list's identity: a file fetched from
      # an artifact is compared with them before it is used (the format document's section 11).
      - name: Write the collection report and the observation list
        env:
          P5002_MODE: ${{ inputs.mode }}
          P5002_REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
          SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          case "$P5002_MODE" in CONFIRMATORY|EXPLORATORY) ;; *) echo "p5002: INPUT mode" >&2; exit 2 ;; esac
          [[ "$P5002_REGISTRATION_SHA256" =~ ^([0-9a-f]{64})?$ ]] || { echo "p5002: INPUT registration_sha256" >&2; exit 2; }
          registration=""
          if [ "$P5002_MODE" = CONFIRMATORY ]; then registration="$P5002_REGISTRATION_SHA256"; fi
          status=0
          python3 tools/claude_track_p5002_confirm.py report --mode "$P5002_MODE" \
            --registration-sha256 "$registration" --listing target/p5002/listing \
            --attempts target/p5002/attempts --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha256 "$SOURCE_SHA256" \
            --output target/p5002/report.json --observations target/p5002/observations.json || status=$?
          for file in target/p5002/report.json target/p5002/observations.json; do
            if [ -f "$file" ]; then
              sha256sum "$file"
              cat "$file"
            fi
          done
          exit "$status"

      - name: Upload the report
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p5002-report-attempt-${{ github.run_attempt }}
          path: |
            target/p5002/report.json
            target/p5002/observations.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: true
